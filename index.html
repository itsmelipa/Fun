<!DOCTYPE html> <html lang="fa" dir="rtl"> <head> <meta charset="UTF-8" /> <meta name="viewport" content="width=device-width, initial-scale=1.0"/> <title>پورتفولیو | MrBot</title> <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;300;400;700;900&display=swap" rel="stylesheet"/> <style> *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; } :root { --bg: #080b10; --surface: #0d1117; --card: #111820; --border: #1e2a38; --accent: #00d4ff; --accent2: #7b2fff; --text: #e2eaf4; --muted: #5a7080; --glow: 0 0 40px rgba(0,212,255,.25); } html { scroll-behavior: smooth; } body { font-family: 'Vazirmatn', sans-serif; background: var(--bg); color: var(--text); overflow-x: hidden; cursor: none; } /* ── Custom Cursor ── */ #cursor { position: fixed; width: 12px; height: 12px; background: var(--accent); border-radius: 50%; pointer-events: none; z-index: 9999; transform: translate(-50%,-50%); transition: transform .1s, width .3s, height .3s, opacity .3s; mix-blend-mode: screen; } #cursor-ring { position: fixed; width: 36px; height: 36px; border: 1px solid rgba(0,212,255,.4); border-radius: 50%; pointer-events: none; z-index: 9998; transform: translate(-50%,-50%); transition: transform .18s ease, width .3s, height .3s; } /* ── Noise overlay ── */ body::before { content: ''; position: fixed; inset: 0; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E"); pointer-events: none; z-index: 1; opacity: .4; } /* ── Grid bg ── */ body::after { content: ''; position: fixed; inset: 0; background-image: linear-gradient(rgba(0,212,255,.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0,212,255,.03) 1px, transparent 1px); background-size: 60px 60px; pointer-events: none; z-index: 0; } /* ── NAV ── */ nav { position: fixed; top: 0; width: 100%; z-index: 100; padding: 1.2rem 3rem; display: flex; justify-content: space-between; align-items: center; background: rgba(8,11,16,.7); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); } .logo { font-size: 1.4rem; font-weight: 900; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -1px; } .nav-links { display: flex; gap: 2rem; list-style: none; } .nav-links a { color: var(--muted); text-decoration: none; font-size: .9rem; transition: color .3s; position: relative; } .nav-links a::after { content: ''; position: absolute; bottom: -4px; right: 0; width: 0; height: 1px; background: var(--accent); transition: width .3s; } .nav-links a:hover { color: var(--accent); } .nav-links a:hover::after { width: 100%; } /* ── HERO ── */ .hero { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; padding: 8rem 3rem 4rem; position: relative; z-index: 2; } .hero-tag { font-size: .78rem; letter-spacing: 4px; color: var(--accent); text-transform: uppercase; margin-bottom: 1.5rem; display: flex; align-items: center; gap: .7rem; opacity: 0; animation: fadeUp .8s .2s forwards; } .hero-tag::before { content: ''; width: 30px; height: 1px; background: var(--accent); } h1 { font-size: clamp(3rem, 8vw, 7rem); font-weight: 900; line-height: 1.05; letter-spacing: -3px; opacity: 0; animation: fadeUp .9s .4s forwards; } h1 span { background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; } .hero-sub { font-size: 1.1rem; color: var(--muted); max-width: 520px; margin-top: 1.5rem; line-height: 2; opacity: 0; animation: fadeUp .9s .6s forwards; } .hero-btns { display: flex; gap: 1rem; margin-top: 2.5rem; opacity: 0; animation: fadeUp .9s .8s forwards; } .btn { padding: .85rem 2rem; border-radius: 6px; font-family: 'Vazirmatn', sans-serif; font-size: .95rem; cursor: none; text-decoration: none; transition: all .3s; display: inline-flex; align-items: center; gap: .5rem; } .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; border: none; box-shadow: 0 0 30px rgba(0,212,255,.3); } .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 0 50px rgba(0,212,255,.5); } .btn-outline { background: transparent; color: var(--text); border: 1px solid var(--border); } .btn-outline:hover { border-color: var(--accent); color: var(--accent); } /* Glowing orbs */ .orb { position: absolute; border-radius: 50%; filter: blur(80px); pointer-events: none; z-index: 0; } .orb1 { width: 500px; height: 500px; background: radial-gradient(circle, rgba(0,212,255,.12), transparent 70%); top: 10%; left: -10%; animation: float 8s ease-in-out infinite; } .orb2 { width: 400px; height: 400px; background: radial-gradient(circle, rgba(123,47,255,.1), transparent 70%); bottom: 0; left: 40%; animation: float 10s ease-in-out infinite reverse; } /* ── STATS ── */ .stats { display: flex; gap: 3rem; margin-top: 4rem; padding-top: 3rem; border-top: 1px solid var(--border); opacity: 0; animation: fadeUp .9s 1s forwards; } .stat-num { font-size: 2.5rem; font-weight: 900; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; } .stat-label { font-size: .8rem; color: var(--muted); margin-top: .2rem; } /* ── SECTIONS ── */ section { position: relative; z-index: 2; padding: 6rem 3rem; } .section-title { font-size: clamp(1.8rem, 4vw, 3rem); font-weight: 900; margin-bottom: 3rem; display: flex; align-items: center; gap: 1rem; letter-spacing: -1px; } .section-title::before { content: ''; width: 4px; height: 2.5rem; background: linear-gradient(var(--accent), var(--accent2)); border-radius: 4px; flex-shrink: 0; } /* ── SKILLS ── */ .skills-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; } .skill-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1.8rem; transition: all .3s; position: relative; overflow: hidden; } .skill-card::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(0,212,255,.04), rgba(123,47,255,.04)); opacity: 0; transition: opacity .3s; } .skill-card:hover { border-color: rgba(0,212,255,.3); transform: translateY(-4px); box-shadow: var(--glow); } .skill-card:hover::before { opacity: 1; } .skill-icon { font-size: 2rem; margin-bottom: 1rem; } .skill-name { font-size: 1.1rem; font-weight: 700; margin-bottom: .5rem; } .skill-desc { font-size: .85rem; color: var(--muted); line-height: 1.8; } .skill-bar-wrap { margin-top: 1rem; background: var(--border); border-radius: 99px; height: 4px; } .skill-bar { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width 1.5s cubic-bezier(.4,0,.2,1); } /* ── PROJECTS ── */ .projects-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 2rem; } .project-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; transition: all .3s; position: relative; } .project-card:hover { border-color: rgba(0,212,255,.3); transform: translateY(-6px); box-shadow: var(--glow); } .project-thumb { height: 180px; background: linear-gradient(135deg, var(--surface), var(--border)); display: flex; align-items: center; justify-content: center; font-size: 3rem; position: relative; overflow: hidden; } .project-thumb::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to bottom, transparent 50%, var(--card)); } .project-body { padding: 1.5rem; } .project-tag { font-size: .7rem; letter-spacing: 2px; color: var(--accent); text-transform: uppercase; margin-bottom: .7rem; } .project-title { font-size: 1.2rem; font-weight: 700; margin-bottom: .6rem; } .project-desc { font-size: .85rem; color: var(--muted); line-height: 1.8; } .project-links { display: flex; gap: 1rem; margin-top: 1.2rem; } .project-link { font-size: .8rem; color: var(--accent); text-decoration: none; display: flex; align-items: center; gap: .3rem; transition: opacity .2s; } .project-link:hover { opacity: .7; } /* ── CONTACT ── */ .contact-wrap { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 3rem; max-width: 700px; margin: 0 auto; position: relative; overflow: hidden; } .contact-wrap::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle at 50% 50%, rgba(0,212,255,.04), transparent 60%); pointer-events: none; } .contact-links { display: flex; flex-direction: column; gap: 1rem; margin-top: 2rem; } .contact-item { display: flex; align-items: center; gap: 1rem; padding: 1rem 1.5rem; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; text-decoration: none; color: var(--text); transition: all .3s; } .contact-item:hover { border-color: var(--accent); color: var(--accent); transform: translateX(-4px); } .contact-emoji { font-size: 1.3rem; } .contact-label { font-size: .8rem; color: var(--muted); } .contact-value { font-size: 1rem; font-weight: 600; } /* ── FOOTER ── */ footer { text-align: center; padding: 2rem 3rem; border-top: 1px solid var(--border); color: var(--muted); font-size: .8rem; z-index: 2; position: relative; } /* ── ANIMATIONS ── */ @keyframes fadeUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } } @keyframes float { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-30px) scale(1.05); } } .reveal { opacity: 0; transform: translateY(40px); transition: opacity .8s ease, transform .8s ease; } .reveal.visible { opacity: 1; transform: none; } /* ── MOBILE ── */ @media (max-width: 768px) { nav { padding: 1rem 1.5rem; } .nav-links { display: none; } .hero { padding: 7rem 1.5rem 3rem; } section { padding: 4rem 1.5rem; } .stats { flex-wrap: wrap; gap: 1.5rem; } .contact-wrap { padding: 2rem 1.5rem; } } </style> </head> <body> <div id="cursor"></div> <div id="cursor-ring"></div> <!-- NAV --> <nav> <div class="logo">MrBot</div> <ul class="nav-links"> <li><a href="#about">درباره‌ام</a></li> <li><a href="#skills">مهارت‌ها</a></li> <li><a href="#projects">پروژه‌ها</a></li> <li><a href="#contact">تماس</a></li> </ul> </nav> <!-- HERO --> <section class="hero" id="about"> <div class="orb orb1"></div> <div class="orb orb2"></div> <div class="hero-tag">توسعه‌دهنده و طراح</div> <h1>سلام، من<br/><span>MrBot</span> هستم</h1> <p class="hero-sub"> توسعه‌دهنده‌ای که عاشق ساختن ابزارهای هوشمند، سرورهای امن و تجربه‌های دیجیتال منحصربه‌فرد است. </p> <div class="hero-btns">
