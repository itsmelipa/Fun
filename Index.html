<!DOCTYPE html> <html lang="fa" dir="rtl"> <head> <meta charset="UTF-8"/> <meta name="viewport" content="width=device-width, initial-scale=1.0"/> <title>آپلودر اختصاصی | MrBot</title> <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700;900&display=swap" rel="stylesheet"/> <style> *,*::before,*::after{margin:0;padding:0;box-sizing:border-box} :root{ --bg:#05080f; --s1:#090d18; --s2:#0d1220; --border:#1a2236; --accent:#00c8ff; --purple:#a855f7; --green:#22d3a0; --red:#ff5f7e; --text:#dce8f5; --muted:#4a6278; } body{ font-family:'Vazirmatn',sans-serif; background:var(--bg);color:var(--text); min-height:100vh; display:flex;flex-direction:column; align-items:center;justify-content:center; padding:1.5rem;overflow-x:hidden; } /* BG */ body::before{ content:'';position:fixed;inset:0;z-index:0; background: radial-gradient(ellipse 70% 50% at 20% 30%,rgba(0,200,255,.08),transparent), radial-gradient(ellipse 60% 60% at 80% 70%,rgba(168,85,247,.07),transparent); pointer-events:none; } body::after{ content:'';position:fixed;inset:0;z-index:0; background-image: linear-gradient(rgba(0,200,255,.02) 1px,transparent 1px), linear-gradient(90deg,rgba(0,200,255,.02) 1px,transparent 1px); background-size:50px 50px; pointer-events:none; } .wrap{ position:relative;z-index:1; width:100%;max-width:440px; } /* LOGO */ .logo{ text-align:center;margin-bottom:2rem; font-size:1.8rem;font-weight:900;letter-spacing:-2px; background:linear-gradient(135deg,var(--accent),var(--purple)); -webkit-background-clip:text;-webkit-text-fill-color:transparent; } .logo span{font-size:.8rem;font-weight:300;display:block; -webkit-text-fill-color:var(--muted);letter-spacing:3px;margin-top:.2rem} /* ── LOGIN CARD ── */ .card{ background:var(--s1); border:1px solid var(--border); border-radius:20px;padding:2.5rem 2rem; position:relative;overflow:hidden; } .card::before{ content:'';position:absolute;top:-80px;left:50%;transform:translateX(-50%); width:250px;height:250px;border-radius:50%; background:radial-gradient(circle,rgba(0,200,255,.1),transparent 70%); pointer-events:none; } .card-icon{font-size:2.8rem;text-align:center;margin-bottom:.6rem} .card-title{font-size:1.4rem;font-weight:900;text-align:center;letter-spacing:-1px} .card-sub{font-size:.78rem;color:var(--muted);text-align:center;margin-bottom:2rem;line-height:1.8} .inp-group{margin-bottom:1.2rem} .inp-label{font-size:.72rem;color:var(--muted);margin-bottom:.4rem;letter-spacing:1px;display:block} .inp-row{ display:flex;align-items:center;gap:.7rem; background:var(--s2);border:1px solid var(--border); border-radius:10px;padding:.75rem 1rem; transition:border-color .3s,box-shadow .3s; } .inp-row:focus-within{ border-color:rgba(0,200,255,.5); box-shadow:0 0 20px rgba(0,200,255,.08); } .inp-ico{font-size:1rem;flex-shrink:0;opacity:.7} .inp-row input{ flex:1;background:none;border:none;outline:none; color:var(--text);font-family:'Vazirmatn',sans-serif;font-size:.92rem; direction:ltr;text-align:left; } .inp-row input::placeholder{color:var(--muted)} .eye{cursor:pointer;opacity:.5;transition:opacity .2s;font-size:.9rem;flex-shrink:0} .eye:hover{opacity:1} .err-box{ display:none;margin-bottom:1rem; background:rgba(255,95,126,.08);border:1px solid rgba(255,95,126,.2); border-radius:8px;padding:.6rem 1rem; font-size:.78rem;color:var(--red);text-align:center; } .err-box.show{display:block} .btn-login{ width:100%;padding:.95rem;border-radius:10px;border:none; background:linear-gradient(135deg,var(--accent),var(--purple)); color:#fff;font-family:'Vazirmatn',sans-serif; font-size:1rem;font-weight:700;cursor:pointer; transition:all .3s; box-shadow:0 4px 30px rgba(0,200,255,.2); position:relative;overflow:hidden; } .btn-login:hover{transform:translateY(-2px);box-shadow:0 8px 40px rgba(0,200,255,.3)} .btn-login:active{transform:translateY(0)} .btn-login:disabled{opacity:.6;cursor:not-allowed;transform:none} .secure-note{text-align:center;font-size:.7rem;color:var(--muted);margin-top:1.2rem} /* ── UPLOADER PANEL ── */ #panel{display:none} .up-header{ display:flex;align-items:center;justify-content:space-between; margin-bottom:1.5rem; } .up-title{font-size:1.1rem;font-weight:700} .btn-logout{ background:rgba(255,95,126,.1);border:1px solid rgba(255,95,126,.2); color:var(--red);padding:.35rem .9rem;border-radius:8px; font-family:'Vazirmatn',sans-serif;font-size:.78rem;cursor:pointer; transition:all .3s; } .btn-logout:hover{background:rgba(255,95,126,.2)} .drop-zone{ border:2px dashed var(--border);border-radius:14px; padding:2.5rem 1.5rem;text-align:center;cursor:pointer; transition:all .3s;background:var(--s2); margin-bottom:1.2rem; } .drop-zone:hover,.drop-zone.drag{ border-color:rgba(0,200,255,.5); background:rgba(0,200,255,.04); } .drop-icon{font-size:2.5rem;margin-bottom:.7rem} .drop-txt{font-size:.95rem;font-weight:600;margin-bottom:.2rem} .drop-sub{font-size:.78rem;color:var(--muted)} .drop-size{font-size:.7rem;color:var(--muted);margin-top:.3rem} .file-list{display:flex;flex-direction:column;gap:.6rem;max-height:320px;overflow-y:auto} .file-list::-webkit-scrollbar{width:4px} .file-list::-webkit-scrollbar-track{background:var(--s2)} .file-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px} .fi{ display:flex;align-items:center;gap:.8rem; background:var(--s2);border:1px solid var(--border); border-radius:10px;padding:.75rem 1rem; animation:slideIn .3s ease; } @keyframes slideIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}} .fi-emoji{font-size:1.3rem;flex-shrink:0} .fi-info{flex:1;min-width:0} .fi-name{font-size:.82rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:ltr;text-align:left} .fi-size{font-size:.68rem;color:var(--muted);margin-top:.1rem} .fi-st{font-size:.72rem;flex-shrink:0;white-space:nowrap} .progress-bar{height:3px;background:var(--border);border-radius:99px;margin-top:.4rem;display:none} .progress-fill{height:100%;border-radius:99px;width:0;transition:width .4s; background:linear-gradient(90deg,var(--accent),var(--purple))} .up-stats{ display:flex;gap:.8rem;margin-top:1rem; font-size:.72rem;color:var(--muted); justify-content:center; } .up-stats span{color:var(--accent)} footer-note{display:block;text-align:center;font-size:.68rem;color:var(--muted);margin-top:1.2rem} </style> </head> <body> <div class="wrap"> <div class="logo"> MrBot <span>آپلودر اختصاصی</span> </div> <!-- LOGIN --> <div class="card" id="loginCard"> <div class="card-icon">🔐</div> <div class="card-title">ورود به سیستم</div> <div class="card-sub">دسترسی محدود — فقط کاربران مجاز</div> <div class="inp-group"> <label class="inp-label">نام کاربری</label> <div class="inp-row"> <span class="inp-ico">👤</span> <input type="text" id="uname" placeholder="username" autocomplete="off" spellcheck="false"/> </div> </div> <div class="inp-group"> <label class="inp-label">رمز عبور</label> <div class="inp-row"> <span class="inp-ico">🔑</span> <input type="password" id="upass" placeholder="••••••••" autocomplete="off"/> <span class="eye" id="eyeBtn">👁</span> </div> </div> <div class="err-box" id="errBox">⚠️ نام کاربری یا رمز اشتباه است</div> <button class="btn-login" id="loginBtn" onclick="doLogin()"> <span id="btnTxt">ورود به آپلودر ←</span> <span id="btnLoad" style="display:none">⏳ در حال بررسی...</span> </button> <div class="secure-note">🛡️ اتصال امن · رمزنگاری‌شده</div> </div> <!-- PANEL --> <div class="card" id="panel"> <div class="up-header"> <div class="up-title">📤 آپلودر</div> <button class="btn-logout" onclick="doLogout()">خروج ↩</button> </div> <div class="drop-zone" id="dropZone" ondragover="event.preventDefault();this.classList.add('drag')" ondragleave="this.classList.remove('drag')" ondrop="handleDrop(event)" onclick="document.getElementById('fi').click()">
